

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerPath Kenya</title>
<style>
:root{
  --bg:#ffffff;--card:#f5f8f5;--text:#14201a;--muted:#5b6b62;
  --green:#0b8a42;--green-dark:#076b33;--soft:#e2f3e8;
  --line:#dbe5de;--red:#bb1a1a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.wrap{max-width:650px;margin:auto;padding:16px 18px 40px}
.flag{height:5px;border-radius:5px;background:linear-gradient(90deg,#111 0 30%,var(--red) 30% 36%,var(--green) 36% 64%,var(--red) 64% 70%,#111 70%);margin-bottom:14px}
.brand{font-size:1.2rem;font-weight:800;cursor:pointer}
.tag{color:var(--muted);font-size:.92rem;margin:0 0 18px}
h1{font-size:1.85rem;line-height:1.2;margin:8px 0 14px}
h2{font-size:1.35rem;margin:8px 0 12px}
h3{margin:0 0 6px}
.hero{background:var(--soft);border-radius:22px;padding:20px;margin-bottom:18px}
.welcome-img{width:100%;height:auto;display:block;border-radius:18px;margin-bottom:18px}
.btn{border:0;background:var(--green);color:#fff;font:inherit;font-weight:700;padding:13px 20px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--green-dark)}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card p{margin:0;color:var(--muted)}
.top{border:2px solid var(--green)}
.small{color:var(--muted);font-size:.86rem}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 20px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 22px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;padding:14px 8px;border-radius:16px;cursor:pointer}
.opt span{display:block;font-size:1.5rem}
.opt.sel{border-color:var(--green);background:var(--soft)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.match{display:inline-block;background:var(--soft);color:var(--green);font-weight:800;border-radius:99px;padding:3px 12px;font-size:.85rem;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chips b{background:var(--soft);border-radius:99px;padding:5px 11px;font-size:.85rem}
.back{background:none;border:0;color:var(--green);font:inherit;font-weight:700;padding:0;margin-bottom:10px;cursor:pointer}
.step{display:flex;gap:12px;margin:10px 0}
.num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--green);color:white;font-weight:bold;display:grid;place-items:center;cursor:pointer}
.num.off{background:white;color:var(--green);border:2px solid var(--green)}
.step h3{margin:3px 0}
textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--card);color:var(--text);resize:vertical}
@media(max-width:420px){.opts{grid-template-columns:1fr}.row .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="flag"></div>
  <div class="brand" onclick="go('home')">🎓 CareerPath Kenya</div>
  <p class="tag">Discover your skills. Choose your future.</p>
  <div id="app"></div>
</div>

<script>
const $ = id => document.getElementById(id);

const Q = [
 {q:"What interests you most?",k:"interest",o:[
  ["tech","💻","Technology"],["health","🏥","Healthcare"],["biz","💼","Business"],
  ["art","🎨","Creative Arts"],["eng","🔧","Engineering"],["sport","⚽","Sports & Fitness"],["edu","👩‍🏫","Education"]]},
 {q:"What are you naturally good at? (pick up to 2)",k:"strength",multi:true,o:[
  ["solve","🧩","Problem-solving"],["draw","🎨","Drawing and designing"],["talk","🗣️","Speaking and communicating"],
  ["numbers","🔢","Mathematics and numbers"],["sports","⚽","Sports"],["music","🎵","Music and performing"],
  ["help","🤝","Helping people"],["build","🔧","Building and fixing"],["lead","👑","Leading people"]]},
 {q:"Where are you in your education?",k:"education",o:[
  ["kcse","📘","KCSE / Form 4"],["tvet","🏫","College / TVET"],["uni","🎓","University"],["grad","💼","Graduate"]]},
 {q:"How do you like to work?",k:"style",o:[
  ["computer","🖥️","On a computer"],["people","👥","With people"],["hands","🔧","Hands-on"],["mix","🔀","A mix of all"]]},
 {q:"What matters most in a career?",k:"goal",o:[
  ["earn","💰","Earn quickly"],["stable","🏛️","Stable job"],["own","🚀","Own business"],["impact","🌍","Community impact"]]}
];

const C = [
 {e:"💻",name:"Software Developer",interest:"tech",strength:["solve"],style:"computer",goal:["earn","own"],why:"You enjoy technology and solving problems.",skills:["HTML","CSS","JavaScript","Python"],steps:[
 ["Learn the Basics","Start with HTML, CSS and JavaScript."],
 ["Build Projects","Create websites and simple web apps."],
 ["Create a Portfolio","Show your best projects online."],
 ["Find Opportunities","Explore internships, freelance work and junior roles."]],projects:["Personal portfolio","Business website","Simple web app"]},
 {e:"📊",name:"Data Analyst",interest:"tech",strength:["numbers","solve"],style:"computer",goal:["stable","earn"],why:"You like numbers and finding answers.",skills:["Excel","SQL","Python","Data Visualization"],steps:[
 ["Learn the Basics","Start with Excel and SQL."],
 ["Analyse Data","Practice with public datasets."],
 ["Build a Portfolio","Create dashboards and case studies."],
 ["Find Opportunities","Apply to businesses, NGOs and startups."]],projects:["Exam results analysis","Sales dashboard","Customer survey report"]},
 {e:"🏥",name:"Nurse / Clinical Officer",interest:"health",strength:["help","talk"],style:"people",goal:["stable","impact"],why:"You care about people and want to make a difference.",skills:["Patient Care","Biology","Communication","First Aid"],steps:[
 ["Check Requirements","Confirm KCSE requirements for your chosen programme."],
 ["Train","Explore KMTC, university or approved training routes."],
 ["Gain Experience","Complete required practical training and internship."],
 ["Start Your Career","Explore hospitals, clinics and community health work."]],projects:["First aid awareness poster","Community health volunteering","Health education project"]},
 {e:"💼",name:"Entrepreneur",interest:"biz",strength:["talk","lead"],style:"mix",goal:["own","earn"],why:"You enjoy building ideas and creating opportunities.",skills:["Sales","Marketing","Money Management","Networking"],steps:[
 ["Find a Problem","Identify a real problem people have."],
 ["Test Small","Try selling to a few customers first."],
 ["Learn Business Skills","Track money and learn marketing."],
 ["Grow","Improve, reinvest and grow your business."]],projects:["Sell to 10 customers","Simple business plan","Monthly income tracker"]},
 {e:"🎨",name:"Graphic & Digital Designer",interest:"art",strength:["draw","talk"],style:"computer",goal:["own","earn"],why:"You are creative and enjoy visual ideas.",skills:["Canva","Figma","Design Principles","Branding"],steps:[
 ["Learn Design Basics","Learn colour, layout and typography."],
 ["Create Designs","Make logos, posters and social media graphics."],
 ["Build a Portfolio","Collect your best work."],
 ["Find Clients","Help local businesses and explore freelance work."]],projects:["Logo design","School event poster","Social media kit"]},
 {e:"🔧",name:"Engineer / Technical Professional",interest:"eng",strength:["build","numbers"],style:"hands",goal:["stable","impact"],why:"You enjoy building and fixing things.",skills:["Maths","Physics","Technical Skills","Problem Solving"],steps:[
 ["Choose Your Area","Explore electrical, mechanical, civil or other technical paths."],
 ["Train","Consider TVET, diploma or degree routes."],
 ["Practice","Do projects, attachments and practical work."],
 ["Grow","Gain experience and professional qualifications."]],projects:["Simple technical model","Measurement project","Repair or building project"]},
 {e:"👩‍🏫",name:"Teacher",interest:"edu",strength:["help","talk"],style:"people",goal:["stable","impact"],why:"You enjoy explaining things and helping others learn.",skills:["Communication","Lesson Planning","Subject Knowledge","Patience"],steps:[
 ["Choose Subjects","Identify subjects you enjoy and understand well."],
 ["Train","Explore approved teacher education routes."],
 ["Practice","Tutor or volunteer where appropriate."],
 ["Start Teaching","Explore schools, tutoring and online education."]],projects:["Revision worksheet","Teach a classmate","Tutor a younger learner"]},
 {e:"🎵",name:"Musician & Performing Artist",interest:"art",strength:["music"],style:"mix",goal:["own","impact"],why:"You have musical talent and enjoy performing.",skills:["Performance","Songwriting","Music Theory","Stage Presence"],steps:[
 ["Practice Daily","Develop your voice or instrument."],
 ["Perform","Join events, choirs and talent opportunities."],
 ["Record","Create recordings of your work."],
 ["Grow Your Audience","Collaborate and learn the music business."]],projects:["Record a song","Perform at an event","Write an original song"]},
 {e:"⚽",name:"Sports Coach & Fitness Trainer",interest:"sport",strength:["sports","lead"],style:"hands",goal:["impact","own"],why:"You are active and enjoy helping others improve.",skills:["Fitness","Coaching","First Aid","Teamwork"],steps:[
 ["Stay Active","Learn your sport deeply."],
 ["Train and Certify","Explore coaching and first aid training."],
 ["Gain Experience","Volunteer with teams or communities."],
 ["Grow","Explore clubs, gyms and your own training work."]],projects:["Training session","4-week fitness plan","Volunteer coaching"]},
 {e:"🔧",name:"Plumber",interest:"eng",strength:["build"],style:"hands",goal:["earn","own"],why:"You enjoy practical work and fixing systems.",skills:["Pipe Installation","Water Systems","Drainage","Safety"],steps:[
 ["Learn the Basics","Understand pipes, fittings, water and drainage systems."],
 ["Get Practical Training","Explore TVET or apprenticeship training."],
 ["Practice","Work under an experienced professional where possible."],
 ["Build Your Career","Offer reliable services and build a customer base."]],projects:["Learn pipe fittings","Simple water system model","Assist with supervised repairs"]}
];

let st={i:0,a:{},L:[]};

function go(page,index){
 const app=$("app");
 window.scrollTo({top:0,behavior:"smooth"});
 if(page==="home") home(app);
 else if(page==="quiz") quiz(app);
 else if(page==="results") results(app);
 else if(page==="details") details(app,index);
 else if(page==="road") roadmap(app,index);
 else if(page==="ask") ask(app);
}

function home(A){
 st={i:0,a:{},L:[]};
 A.innerHTML=`
 <div class="hero">
   <img class="welcome-img" src="welcome-careerpath.png" alt="Welcome to CareerPath Kenya"
   onerror="this.style.display='none'">
   <p style="font-weight:700;color:var(--green);margin:0">Karibu! 👋</p>
   <h1>Find careers that fit you 🚀</h1>
   <p class="tag">There are no wrong answers. Tell us what you enjoy and what you’re good at, and we’ll suggest careers to explore. It takes about 2 minutes.</p>
   <button class="btn" onclick="go('quiz')">Start Your Career Journey</button>
 </div>
 <div class="card"><h3>🎯 Discover Careers</h3><p>Find careers matching your interests and strengths.</p></div>
 <div class="card"><h3>📚 Learn Skills</h3><p>See important skills and practical projects to explore.</p></div>
 <div class="card"><h3>🗺️ Follow Your Roadmap</h3><p>Get clear step-by-step guidance toward your future.</p></div>
 <div class="card"><h3>💬 Can’t find your career?</h3><p>Ask about careers such as plumbing, farming, technology, music, business or healthcare.</p><button class="btn ghost" style="margin-top:10px" onclick="go('ask')">Ask for guidance</button></div>
 <p class="small" style="text-align:center">🔒 No sign-up. Your progress is saved on this device.<br>These are ideas to explore, not final decisions.</p>`;
}

function quiz(A){
 const q=Q[st.i];
 const sel=st.a[q.k];
 const selected=v=>q.multi?(sel||[]).includes(v):sel===v;
 const ok=q.multi?(sel&&sel.length>0):!!sel;
 A.innerHTML=`
 <div class="small">Question ${st.i+1} of ${Q.length}</div>
 <div class="bar"><i style="width:${((st.i+1)/Q.length)*100}%"></i></div>
 <h2>${q.q}</h2>
 <div class="opts">${q.o.map(o=>`
   <button class="opt ${selected(o[0])?'sel':''}" onclick="pick('${o[0]}')">
   <span>${o[1]}</span>${o[2]}</button>`).join("")}</div>
 <div class="row">
   ${st.i>0?'<button class="btn ghost" onclick="back()">← Back</button>':'<span></span>'}
   <button class="btn" ${ok?'':'disabled'} onclick="next()">${st.i===Q.length-1?'See Results 🎉':'Next →'}</button>
 </div>`;
}

function pick(v){
 const q=Q[st.i];
 if(q.multi){
   let a=st.a[q.k]||[];
   const x=a.indexOf(v);
   if(x>-1) a.splice(x,1);
   else {if(a.length>=2)a.shift();a.push(v);}
   st.a[q.k]=a;
 }else st.a[q.k]=v;
 quiz($("app"));
}
function next(){if(st.i<Q.length-1){st.i++;quiz($("app"));}else go("results");}
function back(){if(st.i>0){st.i--;quiz($("app"));}}

function score(c){
 let p=0,a=st.a;
 if(a.interest===c.interest)p+=4;
 (a.strength||[]).forEach(s=>{if(c.strength.includes(s))p+=2;});
 if(a.style===c.style)p+=1.5;
 if(a.style==="mix")p+=.7;
 if(c.goal.includes(a.goal))p+=1.5;
 return Math.min(98,Math.round(45+p*7));
}

function results(A){
 const L=C.map((c,j)=>({j,m:score(c)})).sort((a,b)=>b.m-a.m).slice(0,5);
 st.L=L;
 A.innerHTML=`<h2>🎯 Careers Worth Exploring</h2>
 <p class="tag">Based on your interests, strengths and goals, these careers may be good options to explore.</p>
 ${L.map((r,k)=>{const c=C[r.j];return `
 <div class="card ${k===0?'top':''}">
  <h3>${c.e} ${c.name}</h3><span class="match">${r.m}% fit</span>
  <p><b>Why it matches:</b> ${c.why}</p>
  <div class="chips">${c.skills.map(s=>`<b>${s}</b>`).join("")}</div>
  <div class="row" style="margin-top:12px">
   <button class="btn" onclick="go('details',${r.j})">Career Details</button>
   <button class="btn ghost" onclick="go('road',${r.j})">View Roadmap 🗺️</button>
  </div>
 </div>`}).join("")}
 <div class="row"><button class="btn ghost" onclick="go('ask')">Ask a career question</button><button class="btn ghost" onclick="go('home')">Retake Quiz</button></div>`;
}

function details(A,j){
 const c=C[j];
 A.innerHTML=`<button class="back" onclick="go('results')">← Back to results</button>
 <h2>${c.e} ${c.name}</h2>
 <div class="card"><h3>🌟 Why explore this career?</h3><p>${c.why}</p></div>
 <div class="card"><h3>📚 Skills to develop</h3><div class="chips">${c.skills.map(s=>`<b>${s}</b>`).join("")}</div></div>
 <div class="card"><h3>🛠️ Project ideas</h3><p>${c.projects.join(" • ")}</p></div>
 <button class="btn" onclick="go('road',${j})">View Your Roadmap 🗺️</button>`;
}

function loadProgress(j){
 try{return JSON.parse(localStorage.getItem("careerpath_progress_"+j))||[];}
 catch(e){return [];}
}
function toggleStep(j,k){
 let p=loadProgress(j),x=p.indexOf(k);
 if(x>-1)p.splice(x,1);else p.push(k);
 localStorage.setItem("careerpath_progress_"+j,JSON.stringify(p));
 roadmap($("app"),j);
}

function roadmap(A,j){
 const c=C[j],p=loadProgress(j);
 const percent=Math.round((p.length/c.steps.length)*100);
 A.innerHTML=`<button class="back" onclick="go('results')">← Back to results</button>
 <h2>${c.e} ${c.name} Roadmap</h2>
 <div class="card"><div class="row"><b>✅ Your progress</b><b style="color:var(--green)">${percent}%</b></div><div class="bar"><i style="width:${percent}%"></i></div></div>
 ${c.steps.map((s,k)=>`
 <div class="step">
   <div class="num ${p.includes(k)?'':'off'}" onclick="toggleStep(${j},${k})">${p.includes(k)?'✓':k+1}</div>
   <div><h3>${s[0]}</h3><p class="small">${s[1]}</p></div>
 </div>`).join("")}
 <div class="card"><h3>🛠️ Practical projects</h3><p>${c.projects.join(" • ")}</p></div>
 <p class="small">Tap a step number when you complete it. Progress is saved on this device.</p>
 <button class="btn ghost" onclick="go('details',${j})">Career Details</button>`;
}

function ask(A){
 A.innerHTML=`<button class="back" onclick="go('home')">← Back</button>
 <h2>💬 Ask for career guidance</h2>
 <p class="tag">Tell us what you like or what career you are curious about.</p>
 <textarea id="qa" rows="4" maxlength="500" placeholder="Example: I like plumbing. What career can I explore?"></textarea>
 <p class="small">Please don't share your name, phone number or ID.</p>
 <button class="btn" onclick="askGo()">Get guidance</button>
 <div id="ans" style="margin-top:14px"></div>
 <div class="card"><h3>🧭 Need more guidance?</h3><p>Talk to a trusted teacher, career counsellor, training institution or professional in the career you want to explore.</p></div>`;
}

function askGo(){
 const t=($("qa").value||"").trim().toLowerCase();
 const o=$("ans");
 if(t.length<3){o.innerHTML='<div class="card"><p>Please write a little more so we can help.</p></div>';return;}
 let answer="";
 if(/plumb|pipe|drain|water system/.test(t))
   answer="🔧 Plumbing could be a great path to explore. You can learn pipe installation, water systems, drainage and safety through practical training, TVET or an apprenticeship. Building Technology and other technical careers may also interest you.";
 else if(/farm|agriculture|crop|animal|livestock/.test(t))
   answer="🌱 You may enjoy Agriculture, Agribusiness or Agricultural Technology. Explore crop production, animal production, modern farming and agricultural business. Practical experience on a farm can help you discover your interests.";
 else if(/computer|technology|coding|programming|software|website/.test(t))
   answer="💻 You may enjoy Software Development, IT, Data Analysis or Cybersecurity. Start with basic computer skills, then try HTML, CSS and JavaScript. Build small projects and create a portfolio.";
 else if(/music|sing|song|artist|producer/.test(t))
   answer="🎵 You may enjoy Music, Performing Arts, Music Production or Sound Engineering. Practice regularly, perform when possible and build recordings of your work.";
 else if(/business|entrepreneur|selling|shop|money/.test(t))
   answer="💼 You may enjoy Entrepreneurship, Business Management, Marketing or Sales. Learn how to find customers, manage money and market products. You can test a small business idea while learning.";
 else if(/nurse|doctor|hospital|health|medicine/.test(t))
   answer="🏥 You may enjoy Nursing, Clinical Medicine, Medicine or other healthcare careers. Check the current entry requirements for the programme you prefer and explore approved training institutions.";
 else if(/teach|teacher|education|school/.test(t))
   answer="👩‍🏫 You may enjoy teaching and education. Think about subjects you enjoy explaining to others, then explore teacher training and practical tutoring opportunities.";
 else if(/sport|football|fitness|gym|athlete/.test(t))
   answer="⚽ You may enjoy Sports Coaching, Fitness Training or Sports Science. Stay active, learn coaching skills and explore first aid and recognised training.";
 else if(/design|drawing|art|creative/.test(t))
   answer="🎨 You may enjoy Graphic Design, Digital Design, Animation or Creative Arts. Start creating work and build a portfolio with real projects.";
 else
   answer="🌟 Try describing what you enjoy doing, what you are naturally good at, or a career you are curious about. For example: plumbing, farming, technology, music, business, healthcare or design.";
 o.innerHTML=`<div class="card top"><h3>💡 Some ideas to explore</h3><p>${answer}</p><p class="small" style="margin-top:10px">These are ideas to explore. Confirm course and training requirements with the relevant institution.</p></div>`;
}

home($("app"));
</script>
</body>
</html>
